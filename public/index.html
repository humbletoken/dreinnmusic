<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0B0B0E">
  <meta name="description" content="Dreinn Music — многофакторная оценка треков и альбомов до 90 баллов">
  <title>Dreinn Music</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Caveat:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css?v=__ASSET_VERSION__">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="app">
    <div class="screen" id="boot-screen">
      <div class="screen-head">
        <div class="title-block">
          <div class="sk" style="width:60%;height:26px;border-radius:10px"></div>
          <div class="sk" style="width:40%;height:14px;border-radius:7px;margin-top:8px"></div>
        </div>
      </div>
      <div class="sk" style="height:150px;border-radius:28px;margin-bottom:22px"></div>
      <div class="stat-strip">
        <div class="sk" style="height:66px;border-radius:20px"></div>
        <div class="sk" style="height:66px;border-radius:20px"></div>
        <div class="sk" style="height:66px;border-radius:20px"></div>
      </div>
      <div class="sk-row"><div class="sk sk-cover"></div><div class="sk-lines"><div class="sk sk-line" style="width:70%"></div><div class="sk sk-line" style="width:45%"></div></div></div>
      <div class="sk-row"><div class="sk sk-cover"></div><div class="sk-lines"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:38%"></div></div></div>
      <div class="sk-row"><div class="sk sk-cover"></div><div class="sk-lines"><div class="sk sk-line" style="width:66%"></div><div class="sk sk-line" style="width:42%"></div></div></div>
    </div>
  </div>

  <!-- мини-плеер -->
  <div class="mini-player" id="mini-player">
    <img class="cover" id="mp-cover" alt="" src="/img/cover-fallback.svg">
    <div class="body">
      <div class="name" id="mp-title">—</div>
      <div class="meta" id="mp-artist">—</div>
    </div>
    <button class="icon-btn plain" id="mp-open" aria-label="Открыть трек"><span data-icon="maximize-2" data-size="18"></span></button>
    <button class="play-btn" id="mp-toggle" aria-label="Играть/пауза"><span data-icon="pause" data-size="18"></span></button>
    <button class="icon-btn plain" id="mp-close" aria-label="Закрыть плеер"><span data-icon="x" data-size="18"></span></button>
    <div class="progress"><i id="mp-progress"></i></div>
  </div>

  <!-- нижняя навигация -->
  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item on" data-nav="home">
      <span class="dot-wrap"><span data-icon="house" data-size="21" data-stroke="2.2"></span></span>
      <span>Главная</span>
    </button>
    <button class="nav-item" data-nav="search">
      <span class="dot-wrap"><span data-icon="search" data-size="21" data-stroke="2.2"></span></span>
      <span>Поиск</span>
    </button>
    <button class="nav-item" data-nav="discover">
      <span class="dot-wrap"><span data-icon="compass" data-size="21" data-stroke="2.2"></span></span>
      <span>Discover</span>
    </button>
    <button class="nav-item" data-nav="charts">
      <span class="dot-wrap"><span data-icon="trophy" data-size="21" data-stroke="2.2"></span></span>
      <span>Рейтинг</span>
    </button>
    <button class="nav-item" data-nav="profile">
      <span class="dot-wrap"><span data-icon="circle-user" data-size="21" data-stroke="2.2"></span></span>
      <span>Профиль</span>
    </button>
  </nav>

  <div class="toast-host" id="toast-host"></div>

  <div class="sheet-host" id="sheet-host">
    <div class="veil" data-sheet-close></div>
    <div class="sheet" id="sheet"><div class="grabber"></div><div id="sheet-body"></div></div>
  </div>

  <audio id="audio" preload="none" playsinline></audio>

  <script src="/js/icons.js?v=__ASSET_VERSION__"></script>
  <script src="/js/api.js?v=__ASSET_VERSION__"></script>
  <script src="/js/ui.js?v=__ASSET_VERSION__"></script>
  <script src="/js/player.js?v=__ASSET_VERSION__"></script>
  <script src="/js/views.js?v=__ASSET_VERSION__"></script>
  <script src="/js/views-rate.js?v=__ASSET_VERSION__"></script>
  <script src="/js/views-profile.js?v=__ASSET_VERSION__"></script>
  <script src="/js/views-admin.js?v=__ASSET_VERSION__"></script>
  <script src="/js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
